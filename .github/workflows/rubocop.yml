name: Run RuboCop

on:
  workflow_call:

jobs:
  run-rubocop:
    name: Run RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --parallel --format github --format progress