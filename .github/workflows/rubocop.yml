name: Run RuboCop

on:
  workflow_call:

jobs:
  run-rubocop:
    name: Run RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --parallel --format github --format progress